name: Restore tools.ts manual rescue

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore src/server/tools.ts from last known good commit
        run: |
          set -euo pipefail
          GOOD_COMMIT="1ab26ecc4958af24275c13818154d8235bd00fcc"
          git show "$GOOD_COMMIT:src/server/tools.ts" > src/server/tools.ts
          if git diff --quiet -- src/server/tools.ts; then
            echo "src/server/tools.ts already matches $GOOD_COMMIT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/server/tools.ts
          git commit -m "restore(tools): recover last known good server tools"
          git push
