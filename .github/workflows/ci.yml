name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: set -o pipefail; npm ci 2>&1 | tee /tmp/install.log

      - name: Run test suite
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: set -o pipefail; npm test 2>&1 | tee /tmp/tests.log

      - name: TypeScript check
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: set -o pipefail; npm run lint 2>&1 | tee /tmp/lint.log

      - name: Build application
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: set -o pipefail; npm run build 2>&1 | tee /tmp/build.log

      - name: Persist CI verification report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p .ci
          {
            echo "# CI Verification Report"
            echo
            echo "Source commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Install: $INSTALL_OUTCOME"
            echo "Tests: $TEST_OUTCOME"
            echo "TypeScript: $LINT_OUTCOME"
            echo "Build: $BUILD_OUTCOME"
            echo
            for pair in install:/tmp/install.log tests:/tmp/tests.log lint:/tmp/lint.log build:/tmp/build.log; do
              name="${pair%%:*}"
              file="${pair#*:}"
              echo "## $name"
              echo '```text'
              if [ -f "$file" ]; then tail -n 120 "$file"; else echo "not run"; fi
              echo '```'
              echo
            done
          } > .ci/last-run.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/last-run.md
          git commit -m "ci: record verification result [skip ci]" || exit 0
          git push

      - name: Enforce verification gates
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          test "$INSTALL_OUTCOME" = "success"
          test "$TEST_OUTCOME" = "success"
          test "$LINT_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
